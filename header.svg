<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#0d1117}
      .gl1{fill:#1c3553}
      .gl2{fill:#0f2a1a}
      .gl3{fill:#1e1030}
      .gr{stroke:#161b22;stroke-width:1}
      .co{font-family:monospace;font-size:10px;fill:#21262d}
      .tt{font-family:monospace;font-size:12px;fill:#484f58;letter-spacing:1px}
      .nm{font-family:monospace;font-size:40px;font-weight:700;fill:#e6edf3}
      .nb{font-family:monospace;font-size:40px;font-weight:700;fill:#58a6ff}
      .ro{font-family:monospace;font-size:13px;fill:#7d8590}
      .qu{font-family:monospace;font-size:12px;fill:#3fb950}
      .pb{fill:#161b22}
      .pd{fill:none;stroke:#30363d;stroke-width:1}
      .pt{font-family:monospace;font-size:11px}
      .bl{fill:#58a6ff}
      .gr2{fill:#3fb950}
      .pu{fill:#bc8cff}
      .or{fill:#ffa657}
      .cu{fill:#58a6ff;animation:blink 1s step-end infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .d1{animation:p 2s ease-in-out 0s infinite}
      .d2{animation:p 2s ease-in-out .4s infinite}
      .d3{animation:p 2s ease-in-out .8s infinite}
      .d4{animation:p 2s ease-in-out 1.2s infinite}
      .d5{animation:p 2s ease-in-out 1.6s infinite}
      .d6{animation:p 2s ease-in-out 2s infinite}
      .d7{animation:p 2s ease-in-out .2s infinite}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
    </style>
  </defs>
  <rect width="860" height="200" rx="10" class="bg"/>
  <ellipse cx="180" cy="60" rx="180" ry="90" class="gl1" opacity=".35"/>
  <ellipse cx="720" cy="150" rx="160" ry="70" class="gl2" opacity=".35"/>
  <ellipse cx="680" cy="30" rx="120" ry="50" class="gl3" opacity=".30"/>
