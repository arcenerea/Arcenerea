  <text x="212" y="170" class="pt or">Terraform</text>
  <rect x="282" y="154" width="76"  height="24" rx="12" class="pb"/>
  <rect x="282" y="154" width="76"  height="24" rx="12" class="pd"/>
  <circle cx="299" cy="166" r="4" class="or d3"/>
