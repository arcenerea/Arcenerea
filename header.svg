  <rect x="511" y="154" width="62"  height="24" rx="12" class="pd"/>
  <circle cx="528" cy="166" r="4" class="gr2 d6"/>
  <text x="538" y="170" class="pt gr2">Linux</text>
  <rect x="582" y="154" width="108" height="24" rx="12" class="pb"/>
  <rect x="582" y="154" width="108" height="24" rx="12" class="pd"/>
  <circle cx="599" cy="166" r="4" class="pu d7"/>
  <text x="609" y="170" class="pt pu">Sweden-bound</text>
